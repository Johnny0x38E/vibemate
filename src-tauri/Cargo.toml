[package]
name = "vibemate"
version = "0.1.0"
description = "A desktop configuration manager for coding agents"
authors = ["Johnny Huang"]
license = "MIT"
edition = "2024"

[lib]
# A distinct library name avoids collisions with the Windows executable.
name = "vibemate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
keyring = "4.2.0"
tauri-plugin-opener = "2.7.0"
log = "0.4.34"
tauri-plugin-log = "2.10.0"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["macros", "time", "sync"] }
serde_json = "1"

[dev-dependencies]
# The mock runtime tests logging sinks without opening a native window.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
