[package]
name = "vibemate"
version = "0.1.0"
description = "A desktop configuration manager for coding agents"
authors = ["Johnny Huang"]
license = "MIT"
edition = "2024"

[lib]
# A distinct library name avoids collisions with the Windows executable.
name = "vibemate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
keyring = "4.2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
