name: Release

on:
    push:
        tags: ["v*.*.*"]

permissions:
    contents: read

# A second run for the same tag must not upload conflicting assets concurrently.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    prepare:
        name: Validate notes and prepare draft
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        outputs:
            release_id: ${{ steps.draft.outputs.result }}
            tag: ${{ steps.notes.outputs.tag }}
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/setup@v3
              with:
                  runtime: node@24
                  cache: true
                  install: false
            - run: pnpm install --frozen-lockfile
            - run: pnpm run check:frontend
            - name: Validate versions and extract changelog entry
              id: notes
              run: node scripts/release-notes.mjs
            - name: Create or update draft release
              id: draft
              uses: actions/github-script@v7
              env:
                  RELEASE_TAG: ${{ steps.notes.outputs.tag }}
                  RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
              with:
                  script: |
                      const { owner, repo } = context.repo;
                      const tag = process.env.RELEASE_TAG;
                      // Listing releases includes drafts visible to the repository token.
                      const releases = await github.paginate(github.rest.repos.listReleases, {
                        owner, repo, per_page: 100,
                      });
                      const existing = releases.find((release) => release.tag_name === tag);
                      if (existing && !existing.draft) {
                        throw new Error("This release is already published; create a new version instead.");
                      }
                      const data = {
                        owner, repo,
                        name: `vibemate ${tag}`,
                        body: process.env.RELEASE_NOTES,
                        draft: true,
                        prerelease: false,
                      };
                      const release = existing
                        ? await github.rest.repos.updateRelease({ ...data, release_id: existing.id })
                        : await github.rest.repos.createRelease({ ...data, tag_name: tag, target_commitish: context.sha });
                      return release.data.id;

    build:
        name: Bundle (${{ matrix.name }})
        needs: prepare
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS Apple Silicon
                      os: macos-latest
                      target: aarch64-apple-darwin
                      bundles: app,dmg
                    - name: macOS Intel
                      os: macos-latest
                      target: x86_64-apple-darwin
                      bundles: app,dmg
                    - name: Windows x64
                      os: windows-latest
                      target: x86_64-pc-windows-msvc
                      bundles: nsis
                    - name: Linux x64
                      os: ubuntu-24.04
                      target: x86_64-unknown-linux-gnu
                      bundles: deb,appimage
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
            - uses: pnpm/setup@v3
              with:
                  runtime: node@24
                  cache: true
                  install: false
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target
                  key: ${{ matrix.target }}
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
            - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
            - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
            - name: Build installers and attach to draft
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  releaseId: ${{ needs.prepare.outputs.release_id }}
                  tagName: ${{ needs.prepare.outputs.tag }}
                  releaseDraft: true
                  uploadUpdaterJson: false
                  args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
