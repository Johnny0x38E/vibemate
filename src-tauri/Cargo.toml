[package]
name = "vibemate"
version = "0.1.0"
description = "A desktop configuration manager for coding agents"
authors = ["Johnny Huang"]
license = "MIT"
edition = "2024"

[lib]
# A distinct library name avoids collisions with the Windows executable.
name = "vibemate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
keyring = "4.2.0"
tauri-plugin-opener = "2.7.0"
# Native folder picker for skill imports. The dialog is opened from Rust only;
# the frontend calls our own command and never the plugin's IPC commands.
tauri-plugin-dialog = "2.8.2"
log = "0.4.34"
tauri-plugin-log = "2.10.0"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "time", "sync"] }
serde_json = "1"
# Skill imports hash their managed copy; this line is already in the locked graph
# through Tauri, so no additional crate version is introduced.
sha2 = "0.10.9"
# SKILL.md frontmatter is YAML. saphyr is a maintained, pure-Rust YAML 1.2 parser;
# only small frontmatter blocks are parsed and every value is treated as data.
saphyr = "0.2.1"

[dev-dependencies]
# The mock runtime tests logging sinks without opening a native window.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
